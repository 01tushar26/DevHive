version: "3.9"

services:


  server:
    image: devhive:latest
    container_name: devhive-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"


  postgres:
    image: postgres:16-alpine
    container_name: devhive-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${LOCALDB_PASS}
      POSTGRES_DB: DevHive_v1
    expose:
      - 5432

  redis:
    image: redis:7-alpine
    container_name: devhive-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS}
    env_file:
      - .env
    expose:
      - 6379
