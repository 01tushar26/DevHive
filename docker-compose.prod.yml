version: "3.9"

services:

  frontend:
    image: devhive-client:latest
    expose:
      - 80

  server:
    image: devhive:latest
    container_name: devhive-server
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - 8080


  postgres:
    image: postgres:16-alpine
    container_name: devhive-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${PRODB_PASS}
      POSTGRES_DB: DevHive_v1
    expose:
      - 5432

  redis:
    image: redis:7-alpine
    container_name: devhive-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS}
    env_file:
      - .env
    expose:
      - 6379